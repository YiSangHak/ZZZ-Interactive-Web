<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZZZ</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="monitor-wall">

        <article class="monitor" data-id="CAM-001" data-title="EEG MONITOR" data-description="EEG 신호를 실시간으로 분석합니다.">
            <video autoplay muted loop playsinline>
                <source src="assets/videos/cam001.mp4" type="video/mp4">
            </video>
            <div class="label">
                <span class="cam-id">CAM-001</span>
            </div>
        </article>

        <article class="monitor" data-id="CAM-002" data-title="CAMERA 2" data-description="실시간 모니터링을 제공합니다.">
            <video autoplay muted loop playsinline>
                <source src="assets/videos/cam002.mp4" type="video/mp4">
            </video>
            <div class="label">
                <span class="cam-id">CAM-002</span>
            </div>
        </article>

        <article class="monitor" data-id="CAM-003" data-title="CAMERA 3"
            data-description="실시간 모니터링을 제공합니다. 동해물과 백두산이 마르고 닳도록 하느님이 보우하사 우리나라 만세. 무궁화 삼천리 화려강산 대한사람 대한으로 길이 보전하세. 남산 위에 저 소나무 철갑을 두른 듯 바람서리 불변함은 우리 기상일세. 무궁화 삼천리 화려강산 대한사람 대한으로 길이 보전하세. 가을 하늘 공활한데 높고 구름 없이 밝은 달은 우리 가슴 일편단심일세. 무궁화 삼천리 화려강산 대한사람 대한으로 길이 보전하세. 이 기상과 이 맘으로 충성을 다하여 괴로우나 즐거우나 나라 사랑하세. 무궁화 삼천리 화려강산 대한사람 대한으로 길이 보전하세.">
            <video autoplay muted loop playsinline>
                <source src="assets/videos/cam003.mp4" type="video/mp4">
            </video>
            <div class="label">
                <span class="cam-id">CAM-003</span>
            </div>
        </article>

        <article class="monitor" data-id="CAM-004" data-title="CAMERA 4" data-description="실시간 모니터링을 제공합니다.">
            <video autoplay muted loop playsinline>
                <source src="assets/videos/cam004.mp4" type="video/mp4">
            </video>
            <div class="label">
                <span class="cam-id">CAM-004</span>
            </div>
        </article>

        <article class="monitor" id="cam005" data-id="CAM-005" data-title="LIVE ANALYSIS"
            data-description="Real-time subject tracking system.">

            <video id="webcam" autoplay muted playsinline>
            </video>

            <div id="cam005-overlay">

                <canvas id="tracking-canvas"></canvas>

                <div id="cam005-status">

                    <div class="status-title">
                        SIGNAL LOST
                    </div>

                    <div class="status-value">
                        NO SUBJECT
                    </div>

                </div>

            </div>

            <div class="label">

                <span class="cam-id">
                    CAM-005
                </span>

            </div>

        </article>

        <article class="monitor" data-id="CAM-006" data-title="CAMERA 6" data-description="실시간 모니터링을 제공합니다.">
            <video autoplay muted loop playsinline>
                <source src="assets/videos/cam006.mp4" type="video/mp4">
            </video>
            <div class="label">
                <span class="cam-id">CAM-006</span>
            </div>
        </article>

        <article class="monitor" data-id="CAM-007" data-title="CAMERA 7" data-description="실시간 모니터링을 제공합니다.">
            <video autoplay muted loop playsinline>
                <source src="assets/videos/cam007.mp4" type="video/mp4">
            </video>
            <div class="label">
                <span class="cam-id">CAM-007</span>
            </div>
        </article>

        <article class="monitor" data-id="CAM-008" data-title="CAMERA 8" data-description="실시간 모니터링을 제공합니다.">
            <video autoplay muted loop playsinline>
                <source src="assets/videos/cam008.mp4" type="video/mp4">
            </video>
            <div class="label">
                <span class="cam-id">CAM-008</span>
            </div>
        </article>

        <article class="monitor" data-id="CAM-009" data-title="CAMERA 9" data-description="실시간 모니터링을 제공합니다.">
            <video autoplay muted loop playsinline>
                <source src="assets/videos/cam009.mp4" type="video/mp4">
            </video>
            <div class="label">
                <span class="cam-id">CAM-009</span>
            </div>
        </article>

    </main>

    <!-- ===========================
     CROSSHAIR
=========================== -->

    <div id="crosshair">

        <span class="line horizontal"></span>

        <span class="line vertical"></span>

    </div>

    <!-- ===========================
     SCAN RING
=========================== -->

    <div id="cursor-ui">

        <svg class="progress-ring" width="48" height="48">

            <circle class="ring-bg" cx="24" cy="24" r="18" />

            <circle class="ring" cx="24" cy="24" r="18" />

        </svg>

        <span id="progress-text">0</span>

    </div>

    <!-- ===========================
     INFO PANEL
=========================== -->

    <div id="info-panel">

        <div id="info-cam"></div>

        <div id="info-title"></div>

        <div id="info-description"></div>

    </div>


    <!-- ===========================
     VIDEO MODAL
=========================== -->

    <div id="video-modal">

        <div class="modal-window">

            <div id="modal-header">

                <div id="modal-cam"></div>

                <div id="modal-title"></div>

                <div id="modal-description"></div>

            </div>

            <div class="modal-video-wrapper">

                <video id="modal-video" autoplay muted loop playsinline>
                </video>

                <canvas id="modal-tracking-canvas"></canvas>

            </div>

            <div id="modal-footer">

                PRESS ESC TO EXIT • CLICK OUTSIDE

            </div>

        </div>

    </div>

    <script type="module" src="cam005.js"></script>
    <script src="script.js"></script>

</body>

</html>
